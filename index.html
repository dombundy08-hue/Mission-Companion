<title>Not found</title>
<!--
  Deliberately empty.

  Every memo has its own unguessable address and is reached only from the letter it
  belongs to. Nobody arrives at this domain on purpose, so anybody who does gets nothing:
  no name, no explanation, no links, nothing to follow. 404.html is the same page, so a
  wrong address looks identical to the front one.
-->
<style>
html,body{height:100%}
body{margin:0;background:#0d1117;color:rgba(255,255,255,.34);
     display:flex;align-items:center;justify-content:center;
     font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Verdana,sans-serif;
     -webkit-font-smoothing:antialiased}
p{margin:0;padding:24px;text-align:center}
</style>
</head>
<body>
<p>There&rsquo;s nothing here.</p>
</body>
