<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Elder Bundy</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Verdana,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;padding:48px 24px;text-align:center}
.mark{width:96px;height:96px;margin:0 auto 26px;border-radius:22px;background:#ef8354;
      display:flex;align-items:center;justify-content:center;font-size:44px}
h1{font-size:clamp(22px,6vw,28px);margin:0 0 14px;line-height:1.25}
p{font-size:16px;line-height:1.7;color:rgba(255,255,255,.65);margin:0 0 16px}
.foot{margin-top:34px;font-size:13px;color:rgba(255,255,255,.35)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">&#9835;</div>
  <h1>Elder Bundy&rsquo;s letters home</h1>
  <p>This is where the voice memo in Dominic&rsquo;s weekly letter plays.</p>
  <p>There is nothing to browse here &mdash; every letter carries its own link, and that
     link opens the recording it belongs to.</p>
  <div class="foot">Georgia Atlanta North Mission</div>
</div>
</body>
</html>
